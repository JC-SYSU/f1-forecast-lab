<svg xmlns="http://www.w3.org/2000/svg" width="640" height="277" viewBox="0 0 640 277">
<style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;}</style>
<rect width="640" height="277" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="700" fill="#1c1c1e">Race line: version iterations (R10–R11 test window means)</text>
<text x="240" y="75" font-size="12.5" fill="#1c1c1e" text-anchor="end" font-weight="400">Grid baseline</text>
<rect x="250" y="60" width="59" height="22" fill="#9aa4b2" rx="3"/>
<text x="317" y="76" font-size="12.5" fill="#5f6368" text-anchor="start" font-weight="400">0.5438</text>
<text x="240" y="121" font-size="12.5" fill="#1c1c1e" text-anchor="end" font-weight="400">+ standardized features</text>
<rect x="250" y="106" width="199" height="22" fill="#9aa4b2" rx="3"/>
<text x="457" y="122" font-size="12.5" fill="#5f6368" text-anchor="start" font-weight="400">0.5766</text>
<text x="240" y="167" font-size="12.5" fill="#1c1c1e" text-anchor="end" font-weight="400">+ back-of-grid interaction (final)</text>
<rect x="250" y="152" width="264" height="22" fill="#d40000" rx="3"/>
<text x="522" y="168" font-size="12.5" fill="#d40000" text-anchor="start" font-weight="600">0.5917</text>
<text x="20" y="204" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="400">Change 1, baseline → standardized: form and racecraft become within-round standardized relative strengths (+6.04%);</text>
<text x="20" y="221" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="400">Change 2, standardized → final: adds a back-of-grid × constructor-strength interaction (+2.62%).</text>
<text x="20" y="238" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="400">Note: the middle standardized version reported only a mean, so it is absent from the box plot below.</text>
</svg>