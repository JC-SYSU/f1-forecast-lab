<text x="433.12549019607843" y="87.75428571428574" font-size="11" fill="#d40000" text-anchor="start" font-weight="600">N2f2_Wexp: the only gate pass</text>
<text x="364.0" y="464" font-size="12" fill="#1c1c1e" text-anchor="middle" font-weight="400">delta vs incumbent, full window R03-R14</text>
<text x="24" y="248.0" font-size="12" fill="#1c1c1e" text-anchor="middle" transform="rotate(-90 24 248.0)">delta vs incumbent, prospective R10-R14</text>
<text x="78" y="482" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="400">Every variant sits left of the incumbent level: none beats it over the full window.</text>
<text x="78" y="498" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="400">The one variant over the prospective gate (red) loses 0.028 on the full window.</text>
<text x="78" y="514" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="400">The succession rule requires BOTH - the top-right region is empty.</text>
<text x="78" y="530" font-size="11.5" fill="#5f6368" text-anchor="start" font-weight="400">Note: S0/S1 rescaling pairs score identically (the formula standardizes anyway), so points overlap in pairs - 204 combinations, 104 distinct orderings.</text>
